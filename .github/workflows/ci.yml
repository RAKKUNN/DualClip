name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test (Apple Silicon)
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "5.9"

      - name: Resolve dependencies
        run: swift package resolve

      - name: Build (Debug)
        run: swift build -c debug

      - name: Test
        run: swift test

      - name: Build (Release, arm64)
        run: swift build -c release --arch arm64

      # Cross-compiled here. Proves the x86_64 slice compiles and links, but it
      # cannot be executed on this runner — the `intel` job below does that.
      - name: Build (Release, x86_64)
        run: swift build -c release --arch x86_64

  intel:
    name: Build & Test (Intel)
    # Real x86_64 hardware. `macos-13` (the old Intel image) was retired in
    # December 2025; `macos-15-intel` is the replacement and is available
    # until August 2027, after which Actions drops x86_64 entirely.
    runs-on: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No setup-swift here: use the toolchain preinstalled on the image.
      # Package.swift pins swift-tools-version 5.9, so a newer compiler still
      # builds in Swift 5 language mode, and this avoids depending on a 5.9
      # toolchain being published for this image.
      - name: Toolchain info
        run: |
          uname -m
          swift --version

      - name: Assert running on x86_64
        run: test "$(uname -m)" = "x86_64"

      - name: Build (Debug)
        run: swift build -c debug

      # This is the part that cannot be faked by cross-compiling: the suite
      # actually executes on Intel hardware.
      - name: Test
        run: swift test

      - name: Build (Release)
        run: swift build -c release

      - name: Verify binary architecture
        run: |
          BIN=$(swift build -c release --show-bin-path)/DualClip
          file "$BIN"
          lipo -archs "$BIN" | grep -q x86_64
