name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "5.9"

      - name: Resolve dependencies
        run: swift package resolve

      - name: Build (Debug)
        run: swift build -c debug

      - name: Build (Release, arm64)
        run: swift build -c release --arch arm64

      # Cross-compiled on the Apple Silicon runner. This only proves the x86_64
      # slice compiles and links — it cannot be executed here (no guaranteed
      # Rosetta), so runtime behaviour on Intel still needs manual verification.
      - name: Build (Release, x86_64)
        run: swift build -c release --arch x86_64
