name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  APP_NAME: DualClip
  BUNDLE_ID: com.dualclip.app

jobs:
  release:
    name: Build, Sign, Notarize & Release
    runs-on: macos-14
    # Two-arch build adds ~1 build cycle on top of the ≤20 min notarization poll
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "5.9"

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build (Release, universal)
        run: |
          set -euo pipefail
          APP_NAME="${{ env.APP_NAME }}"
          SLICES=()

          # Build each architecture separately. The Bundle.module patch below rewrites
          # generated sources and re-links by hand, so it must run once per slice —
          # a single `--arch arm64 --arch x86_64` build would leave one slice unpatched.
          for ARCH in arm64 x86_64; do
            echo "::group::Build $ARCH"

            swift build -c release --arch "$ARCH" -v 2>&1 | tee "/tmp/build_$ARCH.log" | tail -3

            # Resolve the per-arch bin dir instead of hardcoding .build/release —
            # with --arch, SPM writes to a triple-specific directory.
            BIN=$(swift build -c release --arch "$ARCH" --show-bin-path)
            echo "bin path: $BIN"

            # Patch Bundle.module to use resourceURL (Contents/Resources/) instead of
            # bundleURL (.app/ root) which codesign rejects as "unsealed contents"
            ACCESSOR=$(find "$BIN" -name "resource_bundle_accessor.swift" | head -1)
            echo "--- Patching $ACCESSOR ---"
            sed -i '' 's/Bundle\.main\.bundleURL/Bundle.main.resourceURL!/' "$ACCESSOR"
            grep "mainPath" "$ACCESSOR"

            # Recompile entire KeyboardShortcuts module with patched accessor
            # (SPM uses whole-module-optimization, so all files must be compiled together)
            grep "resource_bundle_accessor.swift" "/tmp/build_$ARCH.log" \
              | grep "swift-frontend" | head -1 \
              | sed 's/-supplementary-output-file-map [^ ]*//' \
              > "/tmp/recompile_$ARCH.sh"
            bash "/tmp/recompile_$ARCH.sh"

            # Re-link executable. The log is arch-scoped, so this regex matches
            # exactly one line — the link command for this slice.
            grep -E -- "-o .*/release/${APP_NAME}$" "/tmp/build_$ARCH.log" \
              | head -1 > "/tmp/relink_$ARCH.sh"
            bash "/tmp/relink_$ARCH.sh"

            # Verify patch is in this slice
            strings "$BIN/$APP_NAME" | grep -q "resourceURL"
            echo "✓ $ARCH patch verified in binary"

            # Copy out before the next iteration. Depending on the SPM version,
            # --show-bin-path may return the same directory for both arches, in
            # which case the next build would overwrite this slice in place.
            cp "$BIN/$APP_NAME" "/tmp/$APP_NAME-$ARCH"
            SLICES+=("/tmp/$APP_NAME-$ARCH")
            echo "::endgroup::"
          done

          # Merge slices into a single universal binary
          mkdir -p /tmp/universal
          lipo -create "${SLICES[@]}" -output "/tmp/universal/$APP_NAME"

          ARCHS=$(lipo -archs "/tmp/universal/$APP_NAME")
          echo "universal archs: $ARCHS"
          echo "$ARCHS" | grep -q "arm64"
          echo "$ARCHS" | grep -q "x86_64"
          echo "✓ Universal binary created (arm64 + x86_64)"

      # --- Code Signing ---
      - name: Import signing certificate
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"

          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERT_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

      - name: Create .app bundle
        run: |
          APP_DIR="${{ runner.temp }}/${{ env.APP_NAME }}.app/Contents"
          mkdir -p "$APP_DIR/MacOS"
          mkdir -p "$APP_DIR/Resources"

          cp "/tmp/universal/${{ env.APP_NAME }}" "$APP_DIR/MacOS/"

          # Copy SPM resource bundles into Contents/Resources/.
          # Scoped to one slice's bin dir — resource bundles are arch-independent,
          # and an unscoped find would now match both slices and copy twice.
          ARM_BIN=$(swift build -c release --arch arm64 --show-bin-path)
          find "$ARM_BIN" -name "*.bundle" -exec cp -R {} "$APP_DIR/Resources/" \;
          echo "=== Resources ==="
          ls -la "$APP_DIR/Resources/" || true
          test -n "$(ls -A "$APP_DIR/Resources/")" || { echo "resource bundle missing"; exit 1; }

          cp ${{ env.APP_NAME }}/Info.plist "$APP_DIR/"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${{ steps.version.outputs.VERSION }}" "$APP_DIR/Info.plist"

      - name: Sign the app
        env:
          SIGNING_IDENTITY: ${{ secrets.SIGNING_IDENTITY }}
        run: |
          codesign --force --deep --options runtime \
            --sign "$SIGNING_IDENTITY" \
            --timestamp \
            "${{ runner.temp }}/${{ env.APP_NAME }}.app"

          codesign --verify --verbose "${{ runner.temp }}/${{ env.APP_NAME }}.app"

      # --- Notarization ---
      - name: Notarize the app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ditto -c -k --keepParent \
            "${{ runner.temp }}/${{ env.APP_NAME }}.app" \
            "${{ runner.temp }}/${{ env.APP_NAME }}-notarize.zip"

          NOTARIZE_ZIP="${{ runner.temp }}/${{ env.APP_NAME }}-notarize.zip"
          NOTARY_ARGS="--apple-id $APPLE_ID --password $APPLE_ID_PASSWORD --team-id $APPLE_TEAM_ID"

          # Submit for notarization
          SUBMIT_OUTPUT=$(xcrun notarytool submit "$NOTARIZE_ZIP" $NOTARY_ARGS 2>&1)
          echo "$SUBMIT_OUTPUT"
          SUBMISSION_ID=$(echo "$SUBMIT_OUTPUT" | grep "id:" | head -1 | awk '{print $2}')
          echo "Submission ID: $SUBMISSION_ID"

          # Poll for completion with retries (max 20 min, check every 30s)
          MAX_ATTEMPTS=40
          for i in $(seq 1 $MAX_ATTEMPTS); do
            sleep 30
            STATUS=$(xcrun notarytool info "$SUBMISSION_ID" $NOTARY_ARGS 2>&1 | grep "status:" | sed 's/.*status: //')
            echo "Attempt $i/$MAX_ATTEMPTS: status=$STATUS"

            if [ "$STATUS" = "Accepted" ]; then
              echo "Notarization succeeded!"
              break
            elif [ "$STATUS" = "Invalid" ] || [ "$STATUS" = "Rejected" ]; then
              echo "Notarization failed with status: $STATUS"
              xcrun notarytool log "$SUBMISSION_ID" $NOTARY_ARGS 2>&1 || true
              exit 1
            fi
          done

          if [ "$STATUS" != "Accepted" ]; then
            echo "Notarization timed out (status: $STATUS)"
            exit 1
          fi

          xcrun stapler staple "${{ runner.temp }}/${{ env.APP_NAME }}.app"

      # --- Package & Release ---
      - name: Create ZIP
        run: |
          cd "${{ runner.temp }}"
          ditto -c -k --keepParent \
            "${{ env.APP_NAME }}.app" \
            "${{ env.APP_NAME }}-${{ steps.version.outputs.VERSION }}-universal.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "${{ env.APP_NAME }} ${{ steps.version.outputs.VERSION }}"
          generate_release_notes: true
          body: |
            ## Installation

            ### Homebrew (recommended)
            ```
            brew install RAKKUNN/tap/dualclip
            ```

            ### Manual
            1. Download `${{ env.APP_NAME }}-${{ steps.version.outputs.VERSION }}-universal.zip`
            2. Unzip and move `${{ env.APP_NAME }}.app` to `/Applications`
            3. Grant Accessibility permission when prompted

            ✅ This build is signed and notarized by Apple.
            ✅ Universal binary — runs natively on both Apple Silicon and Intel Macs.
          files: |
            ${{ runner.temp }}/${{ env.APP_NAME }}-${{ steps.version.outputs.VERSION }}-universal.zip

      # --- Homebrew Tap ---
      - name: Update Homebrew Cask
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          ZIP_URL="https://github.com/RAKKUNN/DualClip/releases/download/v${VERSION}/DualClip-${VERSION}-universal.zip"

          # Download the release ZIP and compute SHA256.
          # -f so a 404 fails instead of silently hashing an error page; retried
          # because the asset can take a few seconds to become downloadable.
          rm -f /tmp/dualclip.zip
          for i in 1 2 3 4 5; do
            if curl -fsSL "$ZIP_URL" -o /tmp/dualclip.zip; then break; fi
            echo "asset not downloadable yet (attempt $i/5), retrying in 10s"
            sleep 10
          done
          unzip -tq /tmp/dualclip.zip

          SHA256=$(shasum -a 256 /tmp/dualclip.zip | awk '{print $1}')
          echo "SHA256: $SHA256"

          # Clone the tap repo, update formula, push
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/RAKKUNN/homebrew-tap.git" /tmp/homebrew-tap
          cd /tmp/homebrew-tap

          sed -i '' "s/version \".*\"/version \"${VERSION}\"/" Casks/dualclip.rb
          sed -i '' "s/sha256 \".*\"/sha256 \"${SHA256}\"/" Casks/dualclip.rb
          # Asset name changed arm64 -> universal. Without this the cask URL keeps
          # pointing at a file that no longer exists and `brew install` 404s.
          sed -i '' 's/-arm64\.zip/-universal.zip/g' Casks/dualclip.rb

          grep -q -- "-arm64" Casks/dualclip.rb \
            && { echo "cask still references -arm64"; exit 1; } || true
          cat Casks/dualclip.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/dualclip.rb
          git commit -m "Bump dualclip to ${VERSION}" || echo "No changes"
          git push
