name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  APP_NAME: DualClip
  BUNDLE_ID: com.dualclip.app

jobs:
  release:
    name: Build, Sign, Notarize & Release
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "5.9"

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build (Release)
        run: |
          # Build with verbose output to capture compiler/linker commands
          swift build -c release -v 2>&1 | tee /tmp/build_log.txt | tail -3

          # Patch Bundle.module to use resourceURL (Contents/Resources/) instead of
          # bundleURL (.app/ root) which codesign rejects as "unsealed contents"
          ACCESSOR=$(find .build -name "resource_bundle_accessor.swift" -path "*/release/*" | head -1)
          echo "--- Patching $ACCESSOR ---"
          sed -i '' 's/Bundle\.main\.bundleURL/Bundle.main.resourceURL!/' "$ACCESSOR"
          grep "mainPath" "$ACCESSOR"

          # Recompile entire KeyboardShortcuts module with patched accessor
          # (SPM uses whole-module-optimization, so all files must be compiled together)
          grep "resource_bundle_accessor.swift" /tmp/build_log.txt \
            | grep "swift-frontend" | head -1 \
            | sed 's/-supplementary-output-file-map [^ ]*//' \
            > /tmp/recompile.sh
          bash /tmp/recompile.sh

          # Re-link DualClip executable
          grep -E -- "-o .*/release/${{ env.APP_NAME }}$" /tmp/build_log.txt \
            | head -1 > /tmp/relink.sh
          bash /tmp/relink.sh

          # Verify patch is in the final binary
          strings .build/*/release/${{ env.APP_NAME }} | grep "resourceURL" && echo "✓ Patch verified in binary"

      # --- Code Signing ---
      - name: Import signing certificate
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"

          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERT_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

      - name: Create .app bundle
        run: |
          APP_DIR="${{ runner.temp }}/${{ env.APP_NAME }}.app/Contents"
          mkdir -p "$APP_DIR/MacOS"
          mkdir -p "$APP_DIR/Resources"

          cp .build/release/${{ env.APP_NAME }} "$APP_DIR/MacOS/"

          # Copy SPM resource bundles into Contents/Resources/
          find .build -name "*.bundle" -path "*/release/*" -exec cp -R {} "$APP_DIR/Resources/" \;
          echo "=== Resources ==="
          ls -la "$APP_DIR/Resources/" || true

          cp ${{ env.APP_NAME }}/Info.plist "$APP_DIR/"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${{ steps.version.outputs.VERSION }}" "$APP_DIR/Info.plist"

      - name: Sign the app
        env:
          SIGNING_IDENTITY: ${{ secrets.SIGNING_IDENTITY }}
        run: |
          codesign --force --deep --options runtime \
            --sign "$SIGNING_IDENTITY" \
            --timestamp \
            "${{ runner.temp }}/${{ env.APP_NAME }}.app"

          codesign --verify --verbose "${{ runner.temp }}/${{ env.APP_NAME }}.app"

      # --- Notarization ---
      - name: Notarize the app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ditto -c -k --keepParent \
            "${{ runner.temp }}/${{ env.APP_NAME }}.app" \
            "${{ runner.temp }}/${{ env.APP_NAME }}-notarize.zip"

          NOTARIZE_ZIP="${{ runner.temp }}/${{ env.APP_NAME }}-notarize.zip"
          NOTARY_ARGS="--apple-id $APPLE_ID --password $APPLE_ID_PASSWORD --team-id $APPLE_TEAM_ID"

          # Submit for notarization
          SUBMIT_OUTPUT=$(xcrun notarytool submit "$NOTARIZE_ZIP" $NOTARY_ARGS 2>&1)
          echo "$SUBMIT_OUTPUT"
          SUBMISSION_ID=$(echo "$SUBMIT_OUTPUT" | grep "id:" | head -1 | awk '{print $2}')
          echo "Submission ID: $SUBMISSION_ID"

          # Poll for completion with retries (max 20 min, check every 30s)
          MAX_ATTEMPTS=40
          for i in $(seq 1 $MAX_ATTEMPTS); do
            sleep 30
            STATUS=$(xcrun notarytool info "$SUBMISSION_ID" $NOTARY_ARGS 2>&1 | grep "status:" | sed 's/.*status: //')
            echo "Attempt $i/$MAX_ATTEMPTS: status=$STATUS"

            if [ "$STATUS" = "Accepted" ]; then
              echo "Notarization succeeded!"
              break
            elif [ "$STATUS" = "Invalid" ] || [ "$STATUS" = "Rejected" ]; then
              echo "Notarization failed with status: $STATUS"
              xcrun notarytool log "$SUBMISSION_ID" $NOTARY_ARGS 2>&1 || true
              exit 1
            fi
          done

          if [ "$STATUS" != "Accepted" ]; then
            echo "Notarization timed out (status: $STATUS)"
            exit 1
          fi

          xcrun stapler staple "${{ runner.temp }}/${{ env.APP_NAME }}.app"

      # --- Package & Release ---
      - name: Create ZIP
        run: |
          cd "${{ runner.temp }}"
          ditto -c -k --keepParent \
            "${{ env.APP_NAME }}.app" \
            "${{ env.APP_NAME }}-${{ steps.version.outputs.VERSION }}-arm64.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "${{ env.APP_NAME }} ${{ steps.version.outputs.VERSION }}"
          generate_release_notes: true
          body: |
            ## Installation

            ### Homebrew (recommended)
            ```
            brew install RAKKUNN/tap/dualclip
            ```

            ### Manual
            1. Download `${{ env.APP_NAME }}-${{ steps.version.outputs.VERSION }}-arm64.zip`
            2. Unzip and move `${{ env.APP_NAME }}.app` to `/Applications`
            3. Grant Accessibility permission when prompted

            ✅ This build is signed and notarized by Apple.
          files: |
            ${{ runner.temp }}/${{ env.APP_NAME }}-${{ steps.version.outputs.VERSION }}-arm64.zip

      # --- Homebrew Tap ---
      - name: Update Homebrew Cask
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          ZIP_URL="https://github.com/RAKKUNN/DualClip/releases/download/v${VERSION}/DualClip-${VERSION}-arm64.zip"

          # Download the release ZIP and compute SHA256
          curl -sL "$ZIP_URL" -o /tmp/dualclip.zip
          SHA256=$(shasum -a 256 /tmp/dualclip.zip | awk '{print $1}')
          echo "SHA256: $SHA256"

          # Clone the tap repo, update formula, push
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/RAKKUNN/homebrew-tap.git" /tmp/homebrew-tap
          cd /tmp/homebrew-tap

          sed -i '' "s/version \".*\"/version \"${VERSION}\"/" Casks/dualclip.rb
          sed -i '' "s/sha256 \".*\"/sha256 \"${SHA256}\"/" Casks/dualclip.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/dualclip.rb
          git commit -m "Bump dualclip to ${VERSION}" || echo "No changes"
          git push
