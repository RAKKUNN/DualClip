  <!-- Set the theme before first paint so a light-mode visitor never sees a
       dark flash. Inline on purpose: an external file would race the render. -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('dualclip-theme');
        if (saved === 'light' || saved === 'dark') {
          document.documentElement.setAttribute('data-theme', saved);
          return;
        }
      } catch (e) { /* private mode — fall through to the OS preference */ }
      if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
